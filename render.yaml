{
  "services": [
    {
      "type": "web",
      "name": "medai-diagnostics",
      "env": "python",
      "buildCommand": "pip install -r requirements.txt",
      "startCommand": "cd medical_diagnosis_api && python manage.py migrate && python manage.py runserver 0.0.0.0:$PORT",
      "healthCheckPath": "/api/health/"
    }
  ]
}